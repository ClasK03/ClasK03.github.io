<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datasalsletare</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <script type="module" src="main.js"></script>
</head>
<body>
    <noscript>Please enable Javascript to view this page!</noscript>

    <h2 id="title">Obokade datasalar idag:</h2>
    <hr>

    <div id="Slot_1">
        <h3>Nu - 17:00:</h3>
        <p>Laddar...</p>
        <hr>
    </div>

    <div id="Slot_2">
        <h3>Nu - 12:00:</h3>
        <p>Laddar...</p>
        <hr>
    </div>

    <div id="Slot_3">
        <h3>Nu - Nu + 2h</h3>
        <p id="Slot_3">Laddar...</p>
        <hr>
    </div>

    <h3>Manuell Sökning:</h3>
    <label for="start-date">Datum:</label>
    <input
    type="date"
    id="start-date"
    name="search-start-date"
    value="2026-05-18"
    min="2026-01-01"
    max="2050-12-31"/>
    <br>
    <label for="start-time">Från:</label>
    <input
    type="time"
    id="start-time"
    name="search-start-time"
    min="05:00"
    max="22:00"
    required/>
    <br>
    <label for="end-time">Till:</label>
    <input
    type="time"
    id="end-time"
    name="search-end-time"
    min="05:00"
    max="22:00"
    required/>
    <br>
    <input id="search-button" type="button" value="Sök!" />

    <div id="Slot_4">
    </div>
